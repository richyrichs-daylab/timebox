name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Version lesen
        id: ver
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Schlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Das Secret KEYSTORE_BASE64 fehlt. Erst den Workflow Create signing key ausführen."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --console=plain

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1) || true
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner nicht gefunden, die Signatur wurde nicht geprüft."
            exit 0
          fi
          OUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          if echo "$OUT" | grep -q 'CN=Android Debug'; then
            echo "::error::Die APK ist mit dem Wegwerf-Schlüssel signiert. Release abgebrochen."
            exit 1
          fi
          SHA=$(echo "$OUT" | grep -m1 'certificate SHA-256 digest' | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//') || true
          echo "### Signatur: eigener Schlüssel" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Timebox-${VERSION}.apk"
          gh release create "v${VERSION}" "Timebox-${VERSION}.apk" \
            --title "Timebox ${VERSION}" \
            --generate-notes \
            --target "$GITHUB_SHA"
